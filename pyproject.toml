[project]
name = "instakill"
version = "0.1.0"
description = "InstaKill starter — mini social-media platform for Programming for AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "numpy>=2.0,<3",
    "sentence-transformers>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
extend-exclude = ["app/domain/models.py"]
